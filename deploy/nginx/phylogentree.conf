resolver 127.0.0.1 valid=10s;

limit_req_zone $binary_remote_addr zone=ip_rps:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=api_rps:10m rate=2r/s;
limit_req_status 429;
server_tokens off;

include /etc/nginx/conf.d/phylogentree_upstream.conf;

server {
    listen 80;
    server_name phylogentree.org www.phylogentree.org;

    client_max_body_size 100m;
    send_timeout 600s;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name phylogentree.org www.phylogentree.org;

    ssl_certificate /etc/letsencrypt/live/phylogentree.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/phylogentree.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 100m;
    send_timeout 600s;

    location ~* (\.\./|%2e%2e%2f|%2e%2e%5c) {
        return 444;
    }

    location ~* ^/(vendor/phpunit|phpunit|wp-admin|wp-login|wordpress|wp-content|cgi-bin|\.git|\.env|\.svn|\.hg|\.bzr) {
        return 444;
    }

    location ~* \.(php|asp|aspx|cgi|pl|rb|jsp)$ {
        return 444;
    }

    root /opt/phylogentree/frontend/current;
    index index.html;

    location / {
        try_files $uri /index.html;
        limit_req zone=ip_rps burst=20 nodelay;
    }

    location /api/ {
        proxy_pass http://phylo_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        limit_req zone=api_rps burst=10 nodelay;
    }
}
